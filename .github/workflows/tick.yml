# Scheduler horario de respaldo.
#
# El plan Hobby de Vercel limita los cron jobs a UNA ejecución diaria — por eso
# vercel.json tenía "0 0 * * *". Con un tick diario, Pocky llegaba a 0 en todos
# los stats cada día y la notificación solo podía salir una vez cada 24 h,
# siempre a la misma hora (el cooldown de 4 h del endpoint era inalcanzable).
#
# Este workflow llama al mismo endpoint cada hora sin coste. Si en algún momento
# se pasa al plan Pro de Vercel, el cron de vercel.json basta y este workflow
# puede desactivarse.
#
# Requiere dos secretos del repositorio (Settings > Secrets and variables > Actions):
#   POCKY_URL    -> https://tu-dominio.com
#   CRON_SECRET  -> el mismo valor que la variable de entorno en Vercel

name: Pocky tick

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de degradación
        run: |
          status=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.POCKY_URL }}/api/cron/tick")
          echo "HTTP $status"
          cat /tmp/body.txt
          test "$status" = "200"
